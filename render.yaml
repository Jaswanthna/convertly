services:
  - type: web
    name: convertly-jaswanthna
    runtime: node
    plan: free
    buildCommand: npm ci --prefix backend && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.16.0"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://jaswanthna.com,https://www.jaswanthna.com
