name: Increment application version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Increment patch version for pushed commits
        id: bump
        env:
          GITHUB_EVENT_PATH: ${{ github.event_path }}
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          const event = JSON.parse(await readFile(process.env.GITHUB_EVENT_PATH, "utf8"));
          const commits = (event.commits || []).filter(({ message }) => !message.includes("[version-bump]"));
          if (!commits.length) {
            console.log("No application commits to version.");
            process.exit(0);
          }

          const versionPath = "frontend/src/version.json";
          const versionData = JSON.parse(await readFile(versionPath, "utf8"));
          const parts = versionData.version.split(".").map(Number);
          if (parts.length !== 3 || parts.some((part) => !Number.isInteger(part))) {
            throw new Error(`Invalid semantic version: ${versionData.version}`);
          }
          parts[2] += commits.length;
          versionData.version = parts.join(".");
          await writeFile(versionPath, `${JSON.stringify(versionData, null, 2)}\n`);
          console.log(`Updated app version to ${versionData.version}`);
          NODE
          if (git diff --quiet -- frontend/src/version.json); then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit version update
        if: steps.bump.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/version.json
          git commit -m "chore: increment app version [version-bump]"
          git push origin main
